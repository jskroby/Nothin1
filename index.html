<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rubicon Automation Core</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="hero">
    <h1>🔥 Rubicon Activated</h1>
    <p>Automation has begun. No human interaction required.</p>
  </div>
  <div id="visitor-count"></div>
  <form id="login-form" class="login">
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Log In</button>
  </form>
  <form id="bio-form" class="login">
    <textarea id="bio-input" placeholder="Enter your bio" rows="4"></textarea>
    <button type="submit">Optimize Bio</button>
  </form>
  <div id="bio-result"></div>
  <form id="booking-form" class="login">
    <input type="text" id="name" placeholder="Name" required />
    <input type="datetime-local" id="time" required />
    <button type="submit">Book</button>
  </form>
  <script src="/main.js"></script>
</body>
</html>
